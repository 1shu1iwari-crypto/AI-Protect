name: Validate ScamGuard
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm test
      - run: npm run evaluate
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:live
      - run: npm run qa:audio
      - run: npm run qa
      - run: npm run qa:reviews
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Play, Hackathon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assemble${{ matrix.flavor }}Debug :app:test${{ matrix.flavor }}DebugUnitTest :app:lint${{ matrix.flavor }}Debug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Protect-${{ matrix.flavor }}-debug
          path: android/app/build/outputs/apk/*/debug/*.apk
  android-whisper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 2eeeba56e9edd762b4b38467bab96c2517163158
          path: native-deps/whisper.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleHackathonDebug :app:testHackathonDebugUnitTest :app:lintHackathonDebug -PwhisperCppDir=${{ github.workspace }}/native-deps/whisper.cpp
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Protect-Hackathon-Whisper-debug
          path: android/app/build/outputs/apk/hackathon/debug/*.apk
